name: Releases

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: releases
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release archive
        run: python3 scripts/package_release.py

      - name: Check version tag
        id: version
        run: |
          tag="v$(python3 scripts/package_release.py --version)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$tag already exists; bump audiobookshelfbridge_version.lua to publish a new release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/audiobookshelfbridge.koplugin.zip
